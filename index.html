<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Purchases List</title>
<meta name="description" content="Home purchases list: pick items, confirm by date, and see history and totals.">
<meta name="theme-color" content="#0D1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Purchases">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="/styles.css">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<main class="wrap">
  <header>
    <div>
      <div class="eyebrow">Home stock · <span id="totalItems">–</span> items · <span id="totalCats">–</span> categories</div>
      <h1><span>Purchases</span> <span>List</span></h1>
    </div>
    <div class="meter" aria-live="polite">
      <b id="filledCount">0<small>/0</small></b>
      <span class="lbl">items picked today</span>
      <div class="bar"><i id="bar"></i></div>
      <span class="save-state" id="saveState"><i></i><span>Connecting</span></span>
    </div>
  </header>

  <section class="history" id="history" aria-labelledby="histTitle">
    <div class="hist-top">
      <div><h2 id="histTitle">History</h2><p id="histMeta">Loading</p></div>
      <div class="seg" role="tablist" aria-label="History view">
        <button type="button" role="tab" data-tab="dates" aria-selected="true">By date</button>
        <button type="button" role="tab" data-tab="totals" aria-selected="false">Totals</button>
      </div>
    </div>
    <div class="hist-body" id="histBody"></div>
    <div class="hist-foot"><button class="linkbtn" id="resetBtn" type="button"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Admin reset</button></div>
  </section>

  <div class="tools">
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Find an item" aria-label="Find an item" autocomplete="off"></label>
    <button class="btn" id="toggleAll" type="button" aria-label="Open all categories"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m7 15 5 5 5-5M7 9l5-5 5 5"/></svg><span class="blbl">Open all</span></button>
    <button class="btn" id="exportBtn" type="button" aria-label="Export CSV"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14"/></svg><span class="blbl">Export CSV</span></button>
  </div>

  <div class="cats" id="cats">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </div>
</main>
<div class="confirm-bar" id="confirmBar">
  <div class="cb-text"><b id="confirmCount">0 items picked</b><span id="confirmHint"></span></div>
  <button class="btn primary" id="confirmBtn" type="button" disabled><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"><path d="m5 12 5 5 9-10"/></svg><span>Confirm</span></button>
</div>
<dialog class="dlg" id="resetDlg" aria-labelledby="resetTitle">
  <form id="resetForm" method="dialog">
    <h2 id="resetTitle">Reset all history?</h2>
    <p>This deletes every saved date, so the totals go back to zero. You can't undo it.</p>
    <label class="fld"><span>Admin passcode</span><input id="passcode" type="password" inputmode="numeric" autocomplete="off" enterkeyhint="done"></label>
    <p class="err" id="resetErr" role="alert"></p>
    <div class="dlg-btns"><button class="btn" id="resetCancel" type="button">Cancel</button><button class="btn danger" id="resetGo" type="submit">Reset</button></div>
  </form>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script src="/app.js"></script>
</body>
</html>
